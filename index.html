    <!-- Centre content -->
    <div style="text-align:center;position:relative;">

      <!-- LAVANYA — letter by letter -->

        <span style="font-family:'DM Serif Display',serif;font-size:56px;color:#fff;display:inline-block;line-height:1;letter-spacing:0.06em;animation:pl-letter 0.65s cubic-bezier(0.16,1,0.3,1) 0.56s both;">V</span>
        <span style="font-family:'DM Serif Display',serif;font-size:56px;color:#fff;display:inline-block;line-height:1;letter-spacing:0.06em;animation:pl-letter 0.65s cubic-bezier(0.16,1,0.3,1) 0.69s both;">A</span>
        <span style="font-family:'DM Serif Display',serif;font-size:56px;color:#fff;display:inline-block;line-height:1;letter-spacing:0.06em;animation:pl-letter 0.65s cubic-bezier(0.16,1,0.3,1) 0.82s both;">N</span>
        <span style="font-family:'DM Serif Display',serif;font-size:56px;color:#fff;display:inline-block;line-height:1;letter-spacing:0.06em;animation:pl-letter 0.65s cubic-bezier(0.16,1,0.3,1) 0.95s both;">Y</span>
        <span style="font-family:'DM Serif Display',serif;font-size:56px;color:#fff;display:inline-block;line-height:1;letter-spacing:0.06em;animation:pl-letter 0.65s cubic-bezier(0.16,1,0.3,1) 1.08s both;">A</span>

    <!-- Counter — bottom left -->

      <div id="pl-bar" style="height:100%;width:0;background:linear-gradient(90deg,transparent 0%,rgba(192,192,192,0.5) 50%,rgba(255,255,255,0.9) 100%);transition:width 0.08s linear;"></div>
    </div>

  <script>
    ;(function () {
      var n = 0;
      var el = document.getElementById('pl-count');
      var bar = document.getElementById('pl-bar');
      function tick() {
        if (n >= 100) return;
        var step = Math.ceil(Math.random() * 3 + (n < 40 ? 1 : n < 75 ? 2 : 3));
        n = Math.min(n + step, 100);
        if (el) el.textContent = n < 10 ? '0' + n : '' + n;
        if (bar) bar.style.width = n + '%';
        if (n < 100) setTimeout(tick, 22 + Math.random() * 28);
      }
      setTimeout(tick, 650);
    })();
  </script>

  <style>
    @keyframes pl-corner {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pl-letter {
      from { opacity: 0; transform: translateY(40%) scale(0.92); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    filter: blur(0); }
    }
    @keyframes pl-line {
      from { transform: scaleX(0); opacity: 0; }
      to   { transform: scaleX(1); opacity: 1; }
    }
    @keyframes pl-sub {
      from { opacity: 0; letter-spacing: 0.25em; }
      to   { opacity: 1; letter-spacing: 0.72em; }
    }
  </style>
