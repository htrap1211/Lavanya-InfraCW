<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />

  <!-- SEO -->
  <title>Lavanya Construction — Building Since 1984 | Residential, Commercial & Industrial</title>
  <meta name="description"
    content="Lavanya Construction — 40+ years of construction excellence. Residential, Commercial, Industrial & Infrastructure projects across Maharashtra, India. Quality craftsmanship since 1984." />
  <meta name="keywords"
    content="Lavanya Construction, construction company, Khopoli, Maharashtra, residential construction, commercial construction, industrial projects, infrastructure development, building contractor" />
  <meta name="author" content="Lavanya Construction" />
  <link rel="canonical" href="https://lavanyaconstruction.com/" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lavanya Construction — Building Since 1984" />
  <meta property="og:description"
    content="40+ years of construction excellence. Residential, Commercial, Industrial & Infrastructure projects across Maharashtra." />
  <meta property="og:url" content="https://lavanyaconstruction.com/" />
  <meta property="og:site_name" content="Lavanya Construction" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lavanya Construction — Building Since 1984" />
  <meta name="twitter:description" content="40+ years of construction excellence across Maharashtra, India." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <!-- Preloader -->
  <div id="preloader"
    style="position:fixed;inset:0;z-index:9999;background:#111111;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
    <div style="text-align:center;">
      <div style="
        width: 160px;
        height: 160px;
        background-color: #ffffff;
        -webkit-mask-image: url('/logo.png');
        mask-image: url('/logo.png');
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        margin: 0 auto;
        opacity: 0.9;
      "></div>
      <div
        style="width:40px;height:2px;background:linear-gradient(90deg,transparent,#C0C0C0,transparent);margin:20px auto 0;animation:pulse-loader 1.5s ease-in-out infinite;">
      </div>
    </div>
  </div>
  <style>
    @keyframes pulse-loader {

      0%,
      100% {
        opacity: 0.3;
        width: 40px;
      }

      50% {
        opacity: 1;
        width: 80px;
      }
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
