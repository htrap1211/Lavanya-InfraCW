<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />

  <!-- SEO -->
  <title>Lavanya Construction — Building Since 1984 | Residential, Commercial & Industrial</title>
  <meta name="description"
    content="Lavanya Construction — 40+ years of construction excellence. Residential, Commercial, Industrial & Infrastructure projects across Maharashtra, India. Quality craftsmanship since 1984." />
  <meta name="keywords"
    content="Lavanya Construction, construction company, Khopoli, Maharashtra, residential construction, commercial construction, industrial projects, infrastructure development, building contractor" />
  <meta name="author" content="Lavanya Construction" />
  <link rel="canonical" href="https://lavanyaconstruction.com/" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lavanya Construction — Building Since 1984" />
  <meta property="og:description"
    content="40+ years of construction excellence. Residential, Commercial, Industrial & Infrastructure projects across Maharashtra." />
  <meta property="og:url" content="https://lavanyaconstruction.com/" />
  <meta property="og:site_name" content="Lavanya Construction" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lavanya Construction — Building Since 1984" />
  <meta name="twitter:description" content="40+ years of construction excellence across Maharashtra, India." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <!-- Preloader -->
  <div id="preloader"
    style="position:fixed;inset:0;z-index:9999;background:#0a0a0a;display:flex;align-items:center;justify-content:center;transition:opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);overflow:hidden;">
    <div style="text-align:center; position:relative;">
      <!-- Architectural Line -->
      <div
        style="position:relative; z-index:1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div
          style="font-family:'DM Serif Display', serif; font-size:48px; color:#ffffff; white-space: nowrap; margin-bottom: -15px; clip-path: inset(0 0 0 0); animation: slide-up-reveal 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.8s both;">
          LAVANYA
        </div>
        <div
          style="width: 0; height: 1px; background: #ffffff; animation: line-grow 0.6s cubic-bezier(0.19, 1, 0.22, 1) forwards, line-split 0.8s cubic-bezier(0.19, 1, 0.22, 1) 0.8s both;">
        </div>
        <div
          style="font-family:'DM Sans', sans-serif; font-size:11px; color:rgba(255,255,255,0.7); margin-top: 15px; letter-spacing: 0.8em; opacity: 0; animation: slide-down-reveal 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.8s both;">
          INFRASTRUCTURE
        </div>
      </div>
    </div>
  </div>
  <style>
    @keyframes line-grow {
      0% {
        width: 0;
        opacity: 0;
      }

      100% {
        width: 280px;
        opacity: 1;
      }
    }

    @keyframes line-split {
      0% {
        transform: scaleY(1);
        opacity: 1;
      }

      100% {
        transform: scaleY(0.1);
        opacity: 0.3;
      }
    }

    @keyframes slide-up-reveal {
      0% {
        transform: translateY(100%);
        opacity: 0;
        filter: brightness(0);
      }

      100% {
        transform: translateY(0);
        opacity: 1;
        filter: brightness(1);
      }
    }

    @keyframes slide-down-reveal {
      0% {
        transform: translateY(-100%);
        opacity: 0;
        letter-spacing: 0.2em;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
        letter-spacing: 0.8em;
      }
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
