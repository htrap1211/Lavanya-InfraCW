<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />

  <!-- SEO -->
  <title>Lavanya Construction — Building Since 1984 | Residential, Commercial & Industrial</title>
  <meta name="description"
    content="Lavanya Construction — 40+ years of construction excellence. Residential, Commercial, Industrial & Infrastructure projects across Maharashtra, India. Quality craftsmanship since 1984." />
  <meta name="keywords"
    content="Lavanya Construction, construction company, Khopoli, Maharashtra, residential construction, commercial construction, industrial projects, infrastructure development, building contractor" />
  <meta name="author" content="Lavanya Construction" />
  <link rel="canonical" href="https://lavanyaconstruction.com/" />

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lavanya Construction — Building Since 1984" />
  <meta property="og:description"
    content="40+ years of construction excellence. Residential, Commercial, Industrial & Infrastructure projects across Maharashtra." />
  <meta property="og:url" content="https://lavanyaconstruction.com/" />
  <meta property="og:site_name" content="Lavanya Construction" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lavanya Construction — Building Since 1984" />
  <meta name="twitter:description" content="40+ years of construction excellence across Maharashtra, India." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <!-- Preload fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <!-- Preloader -->
  <div id="preloader"
    style="position:fixed;inset:0;z-index:9999;background:#0a0a0a;display:flex;align-items:center;justify-content:center;transition:opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);overflow:hidden;">
    <div style="text-align:center; position:relative;">
      <!-- Architectural Line -->
      <div
        style="position:absolute; top:50%; left:50%; width:200vw; height:1px; background:linear-gradient(90deg,transparent,rgba(192,192,192,0.2),transparent); transform:translate(-50%, -50%); animation: blueprint-line 5.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
      </div>

      <div style="position:relative; z-index:1;">
        <div
          style="font-family:'DM Serif Display', serif; font-size:42px; color:#ffffff; white-space: nowrap; margin: 0 auto; opacity:0; filter:blur(10px); animation: cinematic-reveal 3s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;">
          LAVANYA
        </div>
        <div
          style="font-family:'DM Sans', sans-serif; font-size:10px; color:rgba(192,192,192,0.6); margin-top:12px; opacity:0; animation: cinematic-sub-reveal 2.5s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards;">
          INFRASTRUCTURE
        </div>
      </div>
    </div>
  </div>
  <style>
    @keyframes blueprint-line {
      0% {
        width: 0;
        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        width: 200vw;
        opacity: 0.1;
      }
    }

    @keyframes cinematic-reveal {
      0% {
        opacity: 0;
        filter: blur(10px);
        letter-spacing: -0.2em;
        transform: scale(0.9);
      }

      30% {
        opacity: 1;
      }

      100% {
        opacity: 1;
        filter: blur(0);
        letter-spacing: 0.2em;
        transform: scale(1);
      }
    }

    @keyframes cinematic-sub-reveal {
      0% {
        opacity: 0;
        letter-spacing: 0.2em;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        letter-spacing: 0.8em;
        transform: translateY(0);
      }
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
